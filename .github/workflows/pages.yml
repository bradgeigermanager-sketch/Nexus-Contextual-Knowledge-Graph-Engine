name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/docs
          cp site/index.html _site/index.html
          cp site/docs.html _site/docs.html
          cp index.html _site/explorer.html
          cp -R docs _site/docs/
          cp -R data _site/data/
          cp -R schemas _site/schemas/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/docs.html
          test -s _site/explorer.html
          test -s _site/docs/i18n/en/system-overview.md
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
