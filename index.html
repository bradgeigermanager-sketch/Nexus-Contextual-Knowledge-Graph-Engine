                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                            </div>

                            <div className="flex gap-2 pt-3">
                                <button 
                                    type="button" 
                                    onClick={onClose}
                                    className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium"
                                >
                                    Cancel
                                </button>
                                <button 
                                    type="submit"
                                    className="flex-1 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs"
                                >
                                    Create Node
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- INGESTION MODAL COMPONENT ---
        const IngestionModal = ({ onClose, onIngest, existingNodes = [], existingEdges = [] }) => {
            const [graphCategory, setGraphCategory] = useState('ckg'); // 'ckg', 'context', 'entity'
            const [format, setFormat] = useState('json'); // 'json', 'csv', 'cypher'
            const [inputText, setInputText] = useState('');
            const [parsedPreview, setParsedPreview] = useState({ nodes: [], edges: [], error: null });

            // Sample Templates for quick testing
            const templates = {
                ckg: {
                    json: `{\n  "nodes": [\n    { "id": "ckg_10", "label": "Macro Economic Index", "type": "ckg", "desc": "Aggregated global economic indicator" }\n  ],\n  "edges": [\n    { "source": "ckg_10", "target": "n2", "label": "influences", "weight": 0.88 }\n  ]\n}`,
                    csv: `id,label,type,desc\nckg_11,Energy Sector Vector,ckg,Core sector index for oil & renewable trends\n---edges---\nsource,target,label,weight\nckg_11,n5,correlates,0.82`,
                    cypher: `CREATE (n:CKG {id: 'ckg_12', label: 'Supply Chain Model', desc: 'Logistics graph node'})\nCREATE (n)-[:IMPACTS {weight: 0.9}]->(n2)`
                },
                context: {
                    json: `{\n  "nodes": [\n    { "id": "ctx_temporal_2027", "label": "FY 2027 Projections", "type": "temporal", "desc": "Forward time dimension node" }\n  ],\n  "edges": [\n    { "source": "ctx_temporal_2027", "target": "n3", "label": "succeeds", "weight": 0.95 }\n  ]\n}`,
                    csv: `id,label,type,desc\nctx_spat_1,APAC Region,spatial,Asia Pacific regional context\n---edges---\nsource,target,label,weight\nctx_spat_1,n4,adjacent,0.75`,
                    cypher: `CREATE (c:Context {id: 'ctx_top_1', label: 'Robotics Trend', type: 'topical', desc: 'AI Subfield'})\nCREATE (c)-[:CATEGORIZES]->(n6)`
                },
                entity: {
                    json: `{\n  "nodes": [\n    { "id": "ent_corp_1", "label": "Nvidia Corp", "type": "entity", "desc": "Hardware & Semiconductor Vendor" }\n  ],\n  "edges": [\n    { "source": "ent_corp_1", "target": "n6", "label": "leads_market", "weight": 0.97 }\n  ]\n}`,
                    csv: `id,label,type,desc\nent_person_1,CEO Statement,entity,Primary executive quote source\n---edges---\nsource,target,label,weight\nent_person_1,n1,authored,0.9`,
                    cypher: `CREATE (e:Entity {id: 'ent_doc_1', label: 'Q3 Earnings Call Transcripts', desc: 'Source audio transcript'})\nCREATE (e)-[:ATTACHED_TO]->(n2)`
                }
            };

            // Auto load sample code on type/format switch
            useEffect(() => {
                setInputText(templates[graphCategory][format]);
            }, [graphCategory, format]);

            // Live Parser
            useEffect(() => {
                if (!inputText.trim()) {
                    setParsedPreview({ nodes: [], edges: [], error: null });
                    return;
                }

                try {
                    let newNodes = [];
                    let newEdges = [];

                    if (format === 'json') {
                        const parsed = JSON.parse(inputText);
                        const rawNodes = parsed.nodes || (Array.isArray(parsed) ? parsed : []);
                        const rawEdges = parsed.edges || [];

                        const colorMap = { ckg: '#38bdf8', entity: '#10b981', context: '#6366f1', temporal: '#a855f7', spatial: '#f59e0b', topical: '#ec4899' };

                        newNodes = rawNodes.map((n, i) => ({
                            ...n,
                            id: n.id ?? `node_imp_${Date.now()}_${i}`,
                            label: n.label ?? 'Imported Node',
                            type: n.type ?? (graphCategory === 'context' ? 'temporal' : graphCategory),
                            color: n.color || colorMap[n.type] || colorMap[graphCategory] || '#38bdf8',
                            val: n.val ?? 16,
                            desc: n.desc ?? `Imported under ${graphCategory.toUpperCase()} graph schema.`,
                            metrics: n.metrics ?? { source: `${graphCategory.toUpperCase()} JSON-LD`, status: 'Ingested' }
                        }));

                        newEdges = rawEdges.map((e, i) => ({
                            ...e,
                            id: e.id ?? `edge_imp_${Date.now()}_${i}`,
                            source: e.source,
                            target: e.target,
                            label: e.label ?? 'linked_to',
                            weight: e.weight ?? 0.8
                        }));

                    } else if (format === 'csv') {
                        const marker=/(?:^|\r?\n)---edges---(?:\r?\n|$)/,match=marker.exec(inputText);
                        if(!match)throw Error('CSV must contain a ---edges--- separator between nodes and edges.');
                        const nr=parseCsvRecords(inputText.slice(0,match.index).trim()),er=parseCsvRecords(inputText.slice(match.index+match[0].length).trim());
                        const nh=(nr.shift()||[]).map(v=>v.trim().toLowerCase()),eh=(er.shift()||[]).map(v=>v.trim().toLowerCase());
                        if(!['id','label','type'].every(k=>nh.includes(k)))throw Error('Node CSV header must include id,label,type.');
                        if(!['source','target','label','weight'].every(k=>eh.includes(k)))throw Error('Edge CSV header must include source,target,label,weight.');
                        const ni=Object.fromEntries(nh.map((v,i)=>[v,i])),ei=Object.fromEntries(eh.map((v,i)=>[v,i]));
                        const colorMap={ckg:'#38bdf8',entity:'#10b981',context:'#6366f1',temporal:'#a855f7',spatial:'#f59e0b',topical:'#ec4899'};
                        newNodes=nr.map((row,i)=>{const type=row[ni.type]||(graphCategory==='context'?'temporal':graphCategory);let metrics={source:'CSV Table'};if(ni.metrics_json!==undefined&&row[ni.metrics_json]){try{metrics=JSON.parse(row[ni.metrics_json]);}catch{throw Error(`Node CSV row ${i+2} has invalid metrics_json.`);}}return {id:row[ni.id]?.trim(),label:row[ni.label]?.trim(),type,color:row[ni.color]||colorMap[type]||colorMap[graphCategory]||'#38bdf8',val:ni.val!==undefined&&row[ni.val]!==''?Number(row[ni.val]):16,desc:ni.desc!==undefined?row[ni.desc]:'CSV Table Ingestion',metrics};});
                        newEdges=er.map((row,i)=>({id:ei.id!==undefined&&row[ei.id]?.trim()?row[ei.id].trim():`csv_e_${i}`,source:row[ei.source]?.trim(),target:row[ei.target]?.trim(),label:row[ei.label]?.trim()||'relates',weight:row[ei.weight]===''||row[ei.weight]===undefined?0.8:Number(row[ei.weight])}));
                    } else if (format === 'cypher') {
                        // Regex match simple Cypher CREATE patterns
                        const nodeMatches = [...inputText.matchAll(/CREATE\s*\(([^:]+):?([^\s{]*)\s*\{([^}]+)\}\)/gi)];
                        const colorMap = { ckg: '#38bdf8', entity: '#10b981', context: '#6366f1', temporal: '#a855f7', spatial: '#f59e0b', topical: '#ec4899' };

                        newNodes = nodeMatches.map((m, i) => {
                            const propsStr = m[3];
                            const idMatch = propsStr.match(/id:\s*['"]([^'"]+)['"]/);
                            const labelMatch = propsStr.match(/label:\s*['"]([^'"]+)['"]/);
                            const descMatch = propsStr.match(/desc:\s*['"]([^'"]+)['"]/);

                            const nodeType = graphCategory === 'context' ? 'temporal' : graphCategory;
                            return {
                                id: idMatch ? idMatch[1] : `cypher_n_${i}`,
                                label: labelMatch ? labelMatch[1] : 'Cypher Node',
                                type: nodeType,
                                color: colorMap[nodeType] || '#38bdf8',
                                val: 16,
                                desc: descMatch ? descMatch[1] : 'Cypher Query Extraction',
                                metrics: { source: 'Cypher Query' }
                            };
                        });

                        // Regex match simple Cypher relationships
                        const edgeMatches = [...inputText.matchAll(/\(([^)]+)\)-\[:([^\]\s]+)\s*\{?([^}]*)\}?\]->\(([^)]+)\)/gi)];
                        newEdges = edgeMatches.map((m, i) => ({
                            id: `cypher_e_${i}`,
                            source: m[1].trim(),
                            target: m[4].trim(),
                            label: m[2].trim(),
                            weight: 0.85
                        }));
                    }

                    setParsedPreview({ nodes: newNodes, edges: newEdges, error: null });
                } catch (err) {
                    setParsedPreview({ nodes: [], edges: [], error: err.message });
                }
            }, [inputText, format, graphCategory]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => setInputText(event.target.result);
                reader.readAsText(file);
            };

            const confirmIngestion = () => {
                if (parsedPreview.error || parsedPreview.nodes.length === 0) return;
                const validation=validateGraphData([...existingNodes,...parsedPreview.nodes],[...existingEdges,...parsedPreview.edges]);
                if(!validation.valid){setParsedPreview(prev=>({...prev,error:validation.errors.slice(0,4).join(' ')}));return;}
                const accepted=onIngest(parsedPreview.nodes,parsedPreview.edges);
                if(accepted!==false)onClose();
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="glass-panel w-full max-w-3xl p-6 rounded-2xl border border-slate-700 shadow-2xl animate-fade-in flex flex-col gap-5 max-h-[90vh]">
                        {/* Modal Header */}
                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                            <div className="flex items-center gap-2.5">
                                <div className="p-2 bg-cyan-500/20 text-cyan-400 rounded-xl border border-cyan-500/30">
                                    <i className="fa-solid fa-file-import text-lg"></i>
                                </div>
                                <div>
                                    <h3 className="text-base font-bold text-white">Ingest Graph Data</h3>
                                    <p className="text-xs text-slate-400">Import structured dataset into specific graph categories</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white" aria-label="Close modal">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Step 1: Select Graph Category & Format */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Target Graph Type</label>
                                <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-900 rounded-xl border border-slate-800">
                                    {[
                                        { id: 'ckg', label: 'CKG Core', icon: 'fa-network-wired' },
                                        { id: 'context', label: 'Context', icon: 'fa-layer-group' },
                                        { id: 'entity', label: 'Entity', icon: 'fa-database' },
                                    ].map(cat => (
                                        <button
                                            key={cat.id}
                                            onClick={() => setGraphCategory(cat.id)}
                                            className={`py-2 px-2 rounded-lg text-xs font-medium transition-all flex flex-col items-center gap-1 ${
                                                graphCategory === cat.id
                                                    ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40'
                                                    : 'text-slate-400 hover:text-slate-200'
                                            }`}
                                        >
                                            <i className={`fa-solid ${cat.icon}`}></i>
                                            {cat.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Data Format</label>
                                <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-900 rounded-xl border border-slate-800">
                                    {[
                                        { id: 'json', label: 'JSON / LD' },
                                        { id: 'csv', label: 'CSV Table' },
                                        { id: 'cypher', label: 'Cypher' },
                                    ].map(fmt => (
                                        <button
                                            key={fmt.id}
                                            onClick={() => setFormat(fmt.id)}
                                            className={`py-2 px-2 rounded-lg text-xs font-medium transition-all text-center ${
                                                format === fmt.id
                                                    ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40'
                                                    : 'text-slate-400 hover:text-slate-200'
                                            }`}
                                        >
                                            {fmt.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Input Code / File Drop Container */}
                        <div className="space-y-2 flex-1 flex flex-col min-h-0">
                            <div className="flex justify-between items-center text-xs">
                                <span className="font-semibold text-slate-300 uppercase tracking-wider">Raw Input Code or File Upload</span>
                                <label className="text-cyan-400 hover:underline cursor-pointer flex items-center gap-1">
                                    <i className="fa-solid fa-upload"></i> Upload File
                                    <input type="file" onChange={handleFileUpload} accept=".json,.csv,.txt,.cypher" className="hidden" />
                                </label>
                            </div>
                            <textarea 
                                value={inputText}
                                onChange={e => setInputText(e.target.value)}
                                rows="6"
                                placeholder="Paste JSON, CSV, or Cypher snippet..."
                                className="w-full bg-slate-900/90 font-mono text-xs text-cyan-300 p-3 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-500 flex-1 resize-none"
                            ></textarea>
                        </div>

                        {/* Live Parser Indicator & Schema Mapping Preview */}
                        <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-2">
                            <div className="flex justify-between items-center text-xs">
                                <span className="font-semibold text-slate-300 flex items-center gap-2">
                                    <i className="fa-solid fa-list-check text-cyan-400"></i>
                                    Schema Mapping Validation
                                </span>
                                {parsedPreview.error ? (
                                    <span className="text-xs text-rose-400 font-semibold flex items-center gap-1">
                                        <i className="fa-solid fa-circle-exclamation"></i> Parse Error
                                    </span>
                                ) : (
                                    <span className="text-xs text-emerald-400 font-semibold flex items-center gap-1">
                                        <i className="fa-solid fa-circle-check"></i> Validated ({parsedPreview.nodes.length} Nodes, {parsedPreview.edges.length} Edges)
                                    </span>
                                )}
                            </div>

                            {parsedPreview.error ? (
                                <p className="text-xs text-rose-300 font-mono bg-rose-950/40 p-2 rounded-lg border border-rose-900">{parsedPreview.error}</p>
                            ) : (
                                <div className="flex gap-2 flex-wrap">
                                    {parsedPreview.nodes.map((n, idx) => (
                                        <span key={idx} className="text-[10px] px-2 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700 flex items-center gap-1">
                                            <span className="w-2 h-2 rounded-full" style={{ backgroundColor: n.color }}></span>
                                            {n.label} ({n.type})
                                        </span>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Actions */}
                        <div className="flex gap-2">
                            <button 
                                onClick={onClose}
                                className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold"
                            >
                                Cancel
                            </button>
                            <button 
                                onClick={confirmIngestion}
                                disabled={parsedPreview.error || parsedPreview.nodes.length === 0}
                                className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-xs disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
                            >
                                Ingest {parsedPreview.nodes.length} Nodes into Graph
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- EXPORT MODAL COMPONENT ---
        const ExportModal = ({ nodes, edges, onClose, showToast }) => {
            const [exportScope, setExportScope] = useState('all'); // 'all', 'ckg', 'context', 'entity'
            const [exportFormat, setExportFormat] = useState('json'); // 'json', 'csv', 'cypher', 'svg'
            const [incMetadata, setIncMetadata] = useState(true);
            const [incEmbeddings, setIncEmbeddings] = useState(true);

            // Filter nodes by chosen scope
            const targetNodes = useMemo(() => {
                if (exportScope === 'all') return nodes;
                if (exportScope === 'context') {
                    return nodes.filter(n => ['context', 'temporal', 'spatial', 'topical'].includes(n.type));
                }
                return nodes.filter(n => n.type === exportScope);
            }, [nodes, exportScope]);

            const targetNodeIds = useMemo(() => new Set(targetNodes.map(n => n.id)), [targetNodes]);

            const targetEdges = useMemo(() => {
                return edges.filter(e => targetNodeIds.has(e.source) && targetNodeIds.has(e.target));
            }, [edges, targetNodeIds]);

            // Format Output Generator
            const generatedExportText = useMemo(() => {
                if (exportFormat === 'json') {
                    const payload = {
                        schema: "Nexus CKG Engine v2.5",
                        targetType: exportScope,
                        exportedAt: new Date().toISOString(),
                        nodes: targetNodes.map(n => {
                            const nodeObj = { ...n };
                            if (!incMetadata) delete nodeObj.metrics;
                            if (!incEmbeddings) delete nodeObj.vectorDimensions;
                            return nodeObj;
                        }),
                        edges: targetEdges
                    };
                    return JSON.stringify(payload, null, 2);
                } else if (exportFormat === 'csv') {
                    const nf=['id','label','type','val','color','desc','metrics_json'],ef=['id','source','target','label','weight'];
                    const nc=[nf.map(csvField).join(','),...targetNodes.map(n=>nf.map(k=>csvField(k==='metrics_json'?JSON.stringify(n.metrics||{}):n[k])).join(','))].join('\n');
                    const ec=[ef.map(csvField).join(','),...targetEdges.map(e=>ef.map(k=>csvField(e[k])).join(','))].join('\n');
                    return nc+'\n---edges---\n'+ec+'\n';
                } else if (exportFormat === 'cypher') {
                    let cypher = `// Nexus CKG Export Script - Target: ${exportScope.toUpperCase()}\n`;
                    targetNodes.forEach(n => {
                        cypher += `CREATE (:${n.type.toUpperCase()} {id: '${n.id}', label: '${n.label}', desc: '${n.desc}'})\n`;
                    });
                    targetEdges.forEach(e => {
                        cypher += `MATCH (a {id: '${e.source}'}), (b {id: '${e.target}'}) CREATE (a)-[:${e.label.toUpperCase()} {weight: ${e.weight}}]->(b)\n`;
                    });
                    return cypher;
                } else if (exportFormat === 'svg') {
                    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Nexus CKG Engine SVG Export - Scope: ${exportScope} -->
  <rect width="800" height="600" fill="#05070e" />
  ${targetNodes.map((n, i) => `<circle cx="${100 + (i * 80) % 700}" cy="${100 + Math.floor((i * 80) / 700) * 100}" r="20" fill="${n.color}" />`).join('\n  ')}
</svg>`;
                }
                return '';
            }, [targetNodes, targetEdges, exportFormat, exportScope, incMetadata, incEmbeddings]);

            const copyToClipboard = () => {
                const textarea = document.createElement('textarea');
                textarea.value = generatedExportText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast("Copied graph dataset to clipboard.");
            };

            const downloadFile = () => {
                const extensions = { json: 'json', csv: 'csv', cypher: 'cypher', svg: 'svg' };
                const blob = new Blob([generatedExportText], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `nexus_ckg_${exportScope}_export.${extensions[exportFormat]}`;
                link.click();
                showToast("Export file download started.");
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="glass-panel w-full max-w-3xl p-6 rounded-2xl border border-slate-700 shadow-2xl animate-fade-in flex flex-col gap-5 max-h-[90vh]">
                        {/* Modal Header */}
                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                            <div className="flex items-center gap-2.5">
                                <div className="p-2 bg-purple-500/20 text-purple-300 rounded-xl border border-purple-500/30">
                                    <i className="fa-solid fa-file-export text-lg"></i>
                                </div>
                                <div>
                                    <h3 className="text-base font-bold text-white">Export Graph Dataset</h3>
                                    <p className="text-xs text-slate-400">Export selected graph types into standard data formats</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white" aria-label="Close modal">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Filters & Options */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Target Scope</label>
                                <select 
                                    value={exportScope}
                                    onChange={e => setExportScope(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500"
                                >
                                    <option value="all">Full Combined Graph (All Types)</option>
                                    <option value="ckg">CKG Core Knowledge Graph Only</option>
                                    <option value="context">Context Dimensions Only (Temporal/Spatial)</option>
                                    <option value="entity">Entity Graph Only</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Export Format</label>
                                <div className="grid grid-cols-4 gap-1 p-1 bg-slate-900 rounded-xl border border-slate-800">
                                    {[
                                        { id: 'json', label: 'JSON-LD' },
                                        { id: 'csv', label: 'CSV' },
                                        { id: 'cypher', label: 'Cypher' },
                                        { id: 'svg', label: 'SVG' },
                                    ].map(fmt => (
                                        <button
                                            key={fmt.id}
                                            onClick={() => setExportFormat(fmt.id)}
                                            className={`py-1.5 px-1 rounded-lg text-xs font-medium text-center transition-all ${
                                                exportFormat === fmt.id
                                                    ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40'
                                                    : 'text-slate-400 hover:text-slate-200'
                                            }`}
                                        >
                                            {fmt.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Toggles */}
                        <div className="flex flex-wrap gap-4 text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                            <label className="flex items-center gap-2 cursor-pointer">
                                <input 
                                    type="checkbox" 
                                    checked={incMetadata}
                                    onChange={e => setIncMetadata(e.target.checked)}
                                    className="accent-purple-500 rounded"
                                />
                                Include Node Metrics & Attributes
                            </label>

                            <label className="flex items-center gap-2 cursor-pointer">
                                <input 
                                    type="checkbox" 
                                    checked={incEmbeddings}
                                    onChange={e => setIncEmbeddings(e.target.checked)}
                                    className="accent-purple-500 rounded"
                                />
                                Include Vector Dimension Indices
                            </label>
                        </div>

                        {/* Export Code Preview */}
                        <div className="space-y-1 flex-1 flex flex-col min-h-0">
                            <div className="flex justify-between items-center text-xs text-slate-400">
                                <span>Preview ({targetNodes.length} Nodes, {targetEdges.length} Edges)</span>
                                <button onClick={copyToClipboard} className="text-cyan-400 hover:underline flex items-center gap-1">
                                    <i className="fa-solid fa-copy"></i> Copy Raw
                                </button>
                            </div>
                            <textarea 
                                readOnly
                                value={generatedExportText}
                                rows="7"
                                className="w-full bg-slate-900 font-mono text-xs text-purple-300 p-3 rounded-xl border border-slate-700 focus:outline-none flex-1 resize-none"
                            ></textarea>
                        </div>

                        {/* Modal Action Buttons */}
                        <div className="flex gap-2">
                            <button 
                                onClick={onClose}
                                className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold"
                            >
                                Close
                            </button>
                            <button 
                                onClick={downloadFile}
                                className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-xs shadow-md flex items-center justify-center gap-2"
                            >
                                <i className="fa-solid fa-download"></i>
                                Download Export File
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
