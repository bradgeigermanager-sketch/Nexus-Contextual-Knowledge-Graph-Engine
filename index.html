<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus CKG Engine - Contextual Knowledge Graph Explorer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            900: '#0b0f19',
                            950: '#05070e',
                        },
                        cyan: {
                            400: '#22d3ee',
                            500: '#06b6d4',
                        },
                        purple: {
                            500: '#a855f7',
                            600: '#9333ea',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, filter: 'drop-shadow(0 0 10px rgba(34,211,238,0.6))' },
                            '50%': { opacity: 0.7, filter: 'drop-shadow(0 0 2px rgba(34,211,238,0.2))' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #05070e;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.45);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .neon-glow {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), 0 0 30px rgba(168, 85, 247, 0.2);
        }

        /* High Contrast mode styles */
        .high-contrast {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .high-contrast .glass-panel, 
        .high-contrast .glass-card {
            background: #000000 !important;
            border: 2px solid #ffffff !important;
            box-shadow: none !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body className="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- MOCK SEED DATA FOR CKG ---
        const INITIAL_NODES = [
            { id: 'n1', label: 'User Query', type: 'entity', val: 20, color: '#10b981', desc: 'Active user query payload seeking quarterly performance analysis', metrics: { latency: '12ms', weight: 0.95 } },
            { id: 'n2', label: 'Financial Report', type: 'ckg', val: 26, color: '#38bdf8', desc: 'Core Contextual Knowledge Graph entity representing SEC 10-Q filings', metrics: { confidence: '98%', vectorDim: 1536 } },
            { id: 'n3', label: 'Q3 2026', type: 'temporal', val: 18, color: '#a855f7', desc: 'Temporal constraint filter set to current fiscal quarter', metrics: { timeframe: 'Q3-2026', scope: 'Exact' } },
            { id: 'n4', label: 'North America', type: 'spatial', val: 18, color: '#f59e0b', desc: 'Geographic entity bound to regional operational centers', metrics: { lat: 37.77, lon: -122.41 } },
            { id: 'n5', label: 'Revenue Growth', type: 'topical', val: 22, color: '#ec4899', desc: 'Topical domain topic vector for fiscal expansion and margins', metrics: { relevance: 0.92, status: 'Active' } },
            { id: 'n6', label: 'AI Market Trend', type: 'ckg', val: 20, color: '#38bdf8', desc: 'Macroeconomic market trends generated from LLM extractions', metrics: { cluster: 'Technology/AI', density: 0.84 } },
            { id: 'n7', label: 'Regulatory Policy', type: 'context', val: 18, color: '#6366f1', desc: 'Compliance & Governance restriction layers', metrics: { complianceLevel: 'Tier-1 High Risk' } },
            { id: 'n8', label: 'Executive Briefing', type: 'entity', val: 16, color: '#10b981', desc: 'Generated synthesis document target for RAG retrieval', metrics: { status: 'Drafting', topK: 5 } },
        ];

        const INITIAL_EDGES = [
            { id: 'e1', source: 'n1', target: 'n2', label: 'references', weight: 0.9 },
            { id: 'e2', source: 'n2', target: 'n3', label: 'temporal_scope', weight: 0.8 },
            { id: 'e3', source: 'n2', target: 'n4', label: 'spatial_bound', weight: 0.85 },
            { id: 'e4', source: 'n2', target: 'n5', label: 'has_topic', weight: 0.95 },
            { id: 'e5', source: 'n5', target: 'n6', label: 'correlated_with', weight: 0.75 },
            { id: 'e6', source: 'n1', target: 'n7', label: 'constrained_by', weight: 0.88 },
            { id: 'e7', source: 'n6', target: 'n4', label: 'regional_impact', weight: 0.7 },
            { id: 'e8', source: 'n2', target: 'n8', label: 'synthesizes_into', weight: 0.92 }
        ];

        // Default Config settings
        const DEFAULT_CONFIG = {
            embeddingModel: 'text-embedding-3-large',
            topK: 10,
            cosineThreshold: 0.78,
            fusionAlpha: 0.65,
            enableCache: true,
            maxContextTokens: 8192,
            ragStrategy: 'hybrid-vector-graph'
        };


        const validateGraphData = (nodes, edges) => {
            const errors = [];
            if (!Array.isArray(nodes) || !Array.isArray(edges)) return {valid:false,errors:['Nodes and edges must be arrays.']};
            const ids = new Set();
            nodes.forEach((n,i)=>{if(!n||typeof n!=='object'||Array.isArray(n)){errors.push(`Node ${i+1} must be an object.`);return;}if(typeof n.id!=='string'||!n.id.trim())errors.push(`Node ${i+1} needs an ID.`);else if(ids.has(n.id))errors.push(`Duplicate node ID: ${n.id}`);else ids.add(n.id);if(typeof n.label!=='string'||!n.label.trim())errors.push(`Node ${n.id||i+1} needs a label.`);if(n.val!==undefined&&(typeof n.val!=='number'||!Number.isFinite(n.val)||n.val<0))errors.push(`Node ${n.id||i+1} has invalid val.`);});
            const edgeIds=new Set();
            edges.forEach((e,i)=>{if(!e||typeof e!=='object'||Array.isArray(e)){errors.push(`Edge ${i+1} must be an object.`);return;}if(typeof e.id!=='string'||!e.id.trim())errors.push(`Edge ${i+1} needs an ID.`);else if(edgeIds.has(e.id))errors.push(`Duplicate edge ID: ${e.id}`);else edgeIds.add(e.id);if(typeof e.source!=='string'||!ids.has(e.source))errors.push(`Edge ${e.id||i+1} has missing source: ${e.source}`);if(typeof e.target!=='string'||!ids.has(e.target))errors.push(`Edge ${e.id||i+1} has missing target: ${e.target}`);if(e.weight!==undefined&&(typeof e.weight!=='number'||!Number.isFinite(e.weight)||e.weight<0||e.weight>1))errors.push(`Edge ${e.id||i+1} has weight outside 0–1.`);});
            return {valid:errors.length===0,errors};
        };
        const parseCsvRecords = text => {
            const rows=[];let row=[],field='',quoted=false;
            for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++;}else if(ch==='"')quoted=false;else field+=ch;}else if(ch==='"'&&field==='')quoted=true;else if(ch===','){row.push(field);field='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field='';}else field+=ch;}
            if(quoted)throw Error('CSV contains an unterminated quoted field.');if(field.length||row.length){row.push(field);rows.push(row);}return rows.filter(r=>r.some(v=>v.trim()!==''));
        };
        const csvField = value => {const v=value==null?'':String(value);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
        const loadSavedGraph = () => {try{const rn=localStorage.getItem('nexus_ckg_nodes'),re=localStorage.getItem('nexus_ckg_edges');const nodes=rn?JSON.parse(rn):INITIAL_NODES,edges=re?JSON.parse(re):INITIAL_EDGES;const v=validateGraphData(nodes,edges);if(!v.valid)throw Error(v.errors.join(' '));return {nodes,edges};}catch(error){console.warn('Saved graph invalid; using seed data.',error);return {nodes:INITIAL_NODES,edges:INITIAL_EDGES};}};

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeModule, setActiveModule] = useState('explorer');
            const [highContrast, setHighContrast] = useState(false);
            
            const [initialGraph] = useState(() => loadSavedGraph());
            const [nodes, setNodes] = useState(initialGraph.nodes);
            const [edges, setEdges] = useState(initialGraph.edges);

            const [selectedNode, setSelectedNode] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterType, setFilterType] = useState('all');
            const [config, setConfig] = useState(() => {
                const saved = localStorage.getItem('nexus_ckg_config');
                return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
            });
            const [toastMessage, setToastMessage] = useState(null);
            const [isNodeModalOpen, setIsNodeModalOpen] = useState(false);
            const [isIngestModalOpen, setIsIngestModalOpen] = useState(false);
            const [isExportModalOpen, setIsExportModalOpen] = useState(false);

            // Context dimensions state
            const [contexts, setContexts] = useState([
                { id: 'temporal', name: 'Temporal (Time)', weight: 0.85, active: true, desc: 'Filters graph knowledge by relative and absolute timestamps.' },
                { id: 'spatial', name: 'Spatial (Location)', weight: 0.70, active: true, desc: 'Constrains nodes by geospatial bounds and regional relevance.' },
                { id: 'topical', name: 'Topical (Subject)', weight: 0.95, active: true, desc: 'Clusters vectors into semantic taxonomy categories.' },
                { id: 'social', name: 'Social (User / Org)', weight: 0.40, active: false, desc: 'Maps team hierarchy and organizational permissions.' },
                { id: 'security', name: 'Security / Role Policy', weight: 0.90, active: true, desc: 'Enforces data classification and clearance levels.' },
            ]);

            useEffect(() => {
                const validation = validateGraphData(nodes, edges);
                if (!validation.valid) { console.error('Blocked invalid graph persistence:', validation.errors); return; }
                try { localStorage.setItem('nexus_ckg_nodes', JSON.stringify(nodes)); localStorage.setItem('nexus_ckg_edges', JSON.stringify(edges)); }
                catch (error) { console.error('Unable to persist graph:', error); showToast('Graph could not be saved locally.'); }
            }, [nodes, edges]);

            // Save config updates to local storage
            useEffect(() => {
                localStorage.setItem('nexus_ckg_config', JSON.stringify(config));
            }, [config]);

            // Global Keyboard Shortcuts
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        setSelectedNode(null);
                        setIsNodeModalOpen(false);
                        setIsIngestModalOpen(false);
                        setIsExportModalOpen(false);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const resetToSeedData = () => {
                setNodes(INITIAL_NODES);
                setEdges(INITIAL_EDGES);
                setSelectedNode(null);
                localStorage.removeItem('nexus_ckg_nodes');
                localStorage.removeItem('nexus_ckg_edges');
                showToast("Graph reset to default initial state.");
            };

            const addNode = (newNode, connectedEdge) => {
                setNodes(prev => [...prev, newNode]);
                if (connectedEdge && connectedEdge.target) {
                    setEdges(prev => [...prev, {
                        id: `e_${Date.now()}`,
                        source: newNode.id,
                        target: connectedEdge.target,
                        label: connectedEdge.label || 'connected_to',
                        weight: 0.8
                    }]);
                }
                showToast(`Node "${newNode.label}" added & persisted.`);
            };

            const handleBulkIngest = (newNodes, newEdges) => {
                const candidateNodes=[...nodes,...newNodes],candidateEdges=[...edges,...newEdges];
                const validation=validateGraphData(candidateNodes,candidateEdges);
                if(!validation.valid){showToast(`Import rejected: ${validation.errors.slice(0,2).join(' ')}`);return false;}
                setNodes(candidateNodes);setEdges(candidateEdges);
                showToast(`Imported ${newNodes.length} nodes and ${newEdges.length} edges.`);return true;
            };

            return (
                <div className={`min-h-screen flex flex-col transition-colors duration-300 ${highContrast ? 'high-contrast' : ''}`}>
                    {/* Header Bar */}
                    <Header 
                        activeModule={activeModule} 
                        setActiveModule={setActiveModule}
                        highContrast={highContrast}
                        setHighContrast={setHighContrast}
                        onOpenIngest={() => setIsIngestModalOpen(true)}
                        onOpenExport={() => setIsExportModalOpen(true)}
                        onResetGraph={resetToSeedData}
                    />

                    {/* Main Workspace Layout */}
                    <div className="flex-1 flex pt-16 overflow-hidden">
                        {/* Sidebar Navigation */}
                        <Sidebar activeModule={activeModule} setActiveModule={setActiveModule} />

                        {/* Module Views */}
                        <main className="flex-1 relative overflow-y-auto p-4 md:p-6 lg:p-8 ml-16 md:ml-64 transition-all" tabIndex="-1" id="main-content">
                            {activeModule === 'dashboard' && (
                                <DashboardView 
                                    nodes={nodes} 
                                    edges={edges} 
                                    contexts={contexts}
                                    setActiveModule={setActiveModule}
                                />
                            )}

                            {activeModule === 'explorer' && (
                                <ExplorerView 
                                    nodes={nodes}
                                    edges={edges}
                                    selectedNode={selectedNode}
                                    setSelectedNode={setSelectedNode}
                                    searchQuery={searchQuery}
                                    setSearchQuery={setSearchQuery}
                                    filterType={filterType}
                                    setFilterType={setFilterType}
                                    setIsNodeModalOpen={setIsNodeModalOpen}
                                    onOpenIngest={() => setIsIngestModalOpen(true)}
                                    onOpenExport={() => setIsExportModalOpen(true)}
                                />
                            )}

                            {activeModule === 'contexts' && (
                                <ContextManagerView 
                                    contexts={contexts}
                                    setContexts={setContexts}
                                    showToast={showToast}
                                />
                            )}

                            {activeModule === 'config' && (
                                <EngineConfigView 
                                    config={config} 
                                    setConfig={setConfig} 
                                    showToast={showToast}
                                />
                            )}
                        </main>
                    </div>

                    {/* Add Node Modal */}
                    {isNodeModalOpen && (
                        <AddNodeModal 
                            nodes={nodes}
                            onClose={() => setIsNodeModalOpen(false)}
                            onAdd={addNode}
                        />
                    )}

                    {/* Data Ingestion Modal */}
                    {isIngestModalOpen && (
                        <IngestionModal 
                            existingNodes={nodes}
                            existingEdges={edges}
                            onClose={() => setIsIngestModalOpen(false)}
                            onIngest={handleBulkIngest}
                        />
                    )}

                    {/* Data Export Modal */}
                    {isExportModalOpen && (
                        <ExportModal 
                            nodes={nodes}
                            edges={edges}
                            onClose={() => setIsExportModalOpen(false)}
                            showToast={showToast}
                        />
                    )}

                    {/* Toast Notification Popup */}
                    {toastMessage && (
                        <div 
                            role="status" 
                            aria-live="polite"
                            className="fixed bottom-6 right-6 z-50 glass-panel border border-cyan-500/50 text-cyan-300 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce"
                        >
                            <i className="fa-solid fa-circle-check text-cyan-400"></i>
                            <span className="text-sm font-medium">{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        };

        // --- HEADER COMPONENT ---
        const Header = ({ activeModule, setActiveModule, highContrast, setHighContrast, onOpenIngest, onOpenExport, onResetGraph }) => (
            <header className="fixed top-0 left-0 w-full z-50 glass-panel h-16 flex items-center justify-between px-4 md:px-6 border-b border-slate-800">
                <div className="flex items-center gap-3">
                    <div className="w-9 h-9 bg-gradient-to-tr from-cyan-500 via-blue-600 to-purple-600 rounded-xl flex items-center justify-center neon-glow">
                        <i className="fa-solid fa-brain text-white text-base"></i>
                    </div>
                    <div>
                        <h1 className="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-400 leading-tight">
                            Nexus CKG Engine
                        </h1>
                        <p className="text-[10px] text-slate-400 hidden sm:block">Contextual Knowledge Graph v2.5 Pro</p>
                    </div>
                </div>

                {/* Right controls */}
                <div className="flex items-center gap-2 md:gap-3">
                    <button
                        onClick={onResetGraph}
                        className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 transition-all flex items-center gap-1.5"
                        title="Reset graph data back to original state"
                    >
                        <i className="fa-solid fa-rotate-left"></i>
                        <span className="hidden lg:inline">Reset State</span>
                    </button>

                    <button
                        onClick={onOpenIngest}
                        className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition-all flex items-center gap-1.5"
                    >
                        <i className="fa-solid fa-file-import"></i>
                        <span className="hidden sm:inline">Ingest Data</span>
                    </button>

                    <button
                        onClick={onOpenExport}
                        className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 border border-purple-500/30 transition-all flex items-center gap-1.5"
                    >
                        <i className="fa-solid fa-file-export"></i>
                        <span className="hidden sm:inline">Export Graph</span>
                    </button>

                    <div className="h-6 w-[1px] bg-slate-800"></div>

                    {/* Accessibility High Contrast Toggle */}
                    <button
                        onClick={() => setHighContrast(!highContrast)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition-all flex items-center gap-2 ${
                            highContrast 
                                ? 'bg-yellow-400 text-black border-yellow-300' 
                                : 'bg-slate-800/80 hover:bg-slate-700 text-slate-300 border-slate-700'
                        }`}
                        aria-label="Toggle High Contrast Mode"
                        title="Toggle High Contrast for Accessibility"
                    >
                        <i className="fa-solid fa-circle-half-stroke"></i>
                        <span className="hidden md:inline">High Contrast</span>
                    </button>

                    <button 
                        onClick={() => alert("Nexus Engine Documentation:\n1. Graph Explorer: Drag nodes, search by label, filter by context dimension.\n2. Zoom Tools: Use Default (1:1), Fit All Bounds, or Node Focus Zoom.\n3. Ingest Data: Import CKG, Context, or Entity graphs via JSON-LD, CSV, or Cypher.\n4. Persistence: Custom graph nodes are saved automatically in local browser storage.")}
                        className="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700 transition-colors"
                        aria-label="System Documentation and Help"
                        title="System Help & Docs"
                    >
                        <i className="fa-solid fa-circle-question"></i>
                    </button>
                </div>
            </header>
        );

        // --- SIDEBAR COMPONENT ---
        const Sidebar = ({ activeModule, setActiveModule }) => {
            const navItems = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
                { id: 'explorer', icon: 'fa-diagram-project', label: 'Graph Explorer / DB' },
                { id: 'contexts', icon: 'fa-layer-group', label: 'Context Manager' },
                { id: 'config', icon: 'fa-sliders', label: 'Engine Config' },
            ];

            return (
                <aside 
                    className="fixed left-0 top-16 w-16 md:w-64 h-[calc(100vh-64px)] glass-panel border-r border-slate-800 p-3 flex flex-col gap-2 z-40 transition-all"
                    aria-label="Sidebar Navigation"
                >
                    <nav className="space-y-1.5 flex-1">
                        {navItems.map(item => {
                            const isActive = activeModule === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveModule(item.id)}
                                    aria-current={isActive ? 'page' : undefined}
                                    className={`w-full flex items-center gap-3.5 px-3.5 py-3 rounded-xl text-sm font-medium transition-all ${
                                        isActive
                                            ? 'bg-gradient-to-r from-cyan-500/20 to-purple-500/10 text-cyan-300 border border-cyan-500/40 shadow-lg shadow-cyan-950/50'
                                            : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border border-transparent'
                                    }`}
                                >
                                    <i className={`fa-solid ${item.icon} text-lg w-5 text-center ${isActive ? 'text-cyan-400' : 'text-slate-400'}`}></i>
                                    <span className="hidden md:inline">{item.label}</span>
                                </button>
                            );
                        })}
                    </nav>

                    {/* Vector Memory Card */}
                    <div className="hidden md:block p-3.5 rounded-xl bg-slate-900/60 border border-slate-800 mt-auto">
                        <div className="flex items-center justify-between text-xs text-slate-400 mb-2">
                            <span className="font-medium">Vector Memory</span>
                            <span className="text-cyan-400 font-mono">1.2 GB / 2 GB</span>
                        </div>
                        <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div className="bg-gradient-to-r from-cyan-500 to-purple-500 h-full w-[60%] rounded-full"></div>
                        </div>
                        <p className="text-[10px] text-slate-500 mt-2">HNSW Index Status: Optimized</p>
                    </div>
                </aside>
            );
        };

        // --- EXPLORER VIEW (FORCE DIRECTED GRAPH & INSPECTOR) ---
        const ExplorerView = ({ 
            nodes, edges, selectedNode, setSelectedNode, 
            searchQuery, setSearchQuery, filterType, setFilterType, setIsNodeModalOpen,
            onOpenIngest, onOpenExport 
        }) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [viewMode, setViewMode] = useState('graph'); // 'graph' or 'database'
            const [activeDbTab, setActiveDbTab] = useState('nodes'); // 'nodes' or 'edges'
            const [sortField, setSortField] = useState('label');
            const [sortDirection, setSortDirection] = useState('asc');
            const [zoom, setZoom] = useState(1);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragNode, setDragNode] = useState(null);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [hoveredNode, setHoveredNode] = useState(null);

            // Mutable node positions for physics simulation
            const positionsRef = useRef({});

            // Initialize or sync positions cleanly with bounded coordinates
            const refreshGraphLayout = useCallback((recenter = false) => {
                const width = 800;
                const height = 600;
                nodes.forEach((node, i) => {
                    if (!positionsRef.current[node.id] || recenter) {
                        const angle = (i / Math.max(nodes.length, 1)) * 2 * Math.PI;
                        const radius = 140 + (i % 3) * 30;
                        positionsRef.current[node.id] = {
                            x: width / 2 + radius * Math.cos(angle),
                            y: height / 2 + radius * Math.sin(angle),
                            vx: 0,
                            vy: 0
                        };
                    }
                });
            }, [nodes]);

            // Call initial layout initialization
            useEffect(() => {
                refreshGraphLayout();
            }, [refreshGraphLayout]);

            // Synchronize Canvas Dimensions with Container Size (High-DPI / iFrame Aware)
            useEffect(() => {
                const updateCanvasSize = () => {
                    const canvas = canvasRef.current;
                    const container = containerRef.current;
                    if (canvas && container) {
                        const dpr = window.devicePixelRatio || 1;
                        const displayWidth = container.clientWidth;
                        const displayHeight = container.clientHeight;

                        // Set actual buffer size scaled by device pixel ratio for sharp high-DPI/iframe text
                        canvas.width = displayWidth * dpr;
                        canvas.height = displayHeight * dpr;

                        // Maintain CSS size matching display container
                        canvas.style.width = `${displayWidth}px`;
                        canvas.style.height = `${displayHeight}px`;
                    }
                };

                updateCanvasSize();
                window.addEventListener('resize', updateCanvasSize);
                return () => window.removeEventListener('resize', updateCanvasSize);
            }, []);

            // Default Zoom Reset (1:1 Center)
            const zoomDefault = () => {
                setZoom(1.0);
                setPan({ x: 0, y: 0 });
            };

            // Bounding Zoom (Fit all nodes accurately in frame)
            const zoomToBoundingBox = useCallback(() => {
                if (nodes.length === 0) return;
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                
                nodes.forEach(n => {
                    const p = positionsRef.current[n.id];
                    if (p) {
                        minX = Math.min(minX, p.x);
                        maxX = Math.max(maxX, p.x);
                        minY = Math.min(minY, p.y);
                        maxY = Math.max(maxY, p.y);
                    }
                });

                const canvas = canvasRef.current;
                if (!canvas || minX === Infinity) return;

                const padding = 100;
                const boundingWidth = Math.max((maxX - minX) + padding * 2, 200);
                const boundingHeight = Math.max((maxY - minY) + padding * 2, 200);

                const scaleX = canvas.width / boundingWidth;
                const scaleY = canvas.height / boundingHeight;
                const targetZoom = Math.min(Math.max(Math.min(scaleX, scaleY), 0.4), 1.6);

                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;

                setZoom(targetZoom);
                setPan({
                    x: (canvas.width / 2) - (centerX * targetZoom),
                    y: (canvas.height / 2) - (centerY * targetZoom)
                });
            }, [nodes]);

            // Auto fit bounds on initial view mount
            useEffect(() => {
                const timer = setTimeout(() => zoomToBoundingBox(), 200);
                return () => clearTimeout(timer);
            }, [nodes.length, zoomToBoundingBox]);

            // Focus Zoom on Selected Node
            const zoomToSelectedNode = useCallback(() => {
                if (!selectedNode) return;
                const p = positionsRef.current[selectedNode.id];
                const canvas = canvasRef.current;
                if (!p || !canvas) return;

                const targetZoom = 1.6;
                setZoom(targetZoom);
                setPan({
                    x: (canvas.width / 2) - (p.x * targetZoom),
                    y: (canvas.height / 2) - (p.y * targetZoom)
                });
            }, [selectedNode]);

            // Filtered node set
            const filteredNodes = useMemo(() => {
                let result = nodes.filter(n => {
                    const matchesSearch = n.label.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          n.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          n.id.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesType = filterType === 'all' || n.type === filterType;
                    return matchesSearch && matchesType;
                });

                // Sort for Database view
                return result.sort((a, b) => {
                    let valA = a[sortField] || '';
                    let valB = b[sortField] || '';
                    if (typeof valA === 'string') valA = valA.toLowerCase();
                    if (typeof valB === 'string') valB = valB.toLowerCase();
                    if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                    if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }, [nodes, searchQuery, filterType, sortField, sortDirection]);

            const filteredNodeIds = useMemo(() => new Set(filteredNodes.map(n => n.id)), [filteredNodes]);

            // Filtered edges set for DB View
            const filteredEdges = useMemo(() => {
                return edges.filter(e => {
                    const srcNode = nodes.find(n => n.id === e.source);
                    const tgtNode = nodes.find(n => n.id === e.target);
                    const srcLabel = srcNode ? srcNode.label : e.source;
                    const tgtLabel = tgtNode ? tgtNode.label : e.target;
                    
                    return e.label.toLowerCase().includes(searchQuery.toLowerCase()) ||
                           e.source.toLowerCase().includes(searchQuery.toLowerCase()) ||
                           e.target.toLowerCase().includes(searchQuery.toLowerCase()) ||
                           srcLabel.toLowerCase().includes(searchQuery.toLowerCase()) ||
                           tgtLabel.toLowerCase().includes(searchQuery.toLowerCase());
                });
            }, [edges, nodes, searchQuery]);

            // Stable Physics & Canvas Animation Loop
            useEffect(() => {
                if (viewMode !== 'graph') return;
                const canvas = canvasRef.current;
                const container = containerRef.current;
                if (!canvas || !container) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const simulatePhysicsAndRender = () => {
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    const dpr = window.devicePixelRatio || 1;

                    // Repulsion and link physics forces
                    nodes.forEach(n1 => {
                        const p1 = positionsRef.current[n1.id];
                        if (!p1) return;

                        // Central gravity pull to keep nodes in view
                        p1.vx += (width / 2 - p1.x) * 0.0003;
                        p1.vy += (height / 2 - p1.y) * 0.0003;

                        nodes.forEach(n2 => {
                            if (n1.id === n2.id) return;
                            const p2 = positionsRef.current[n2.id];
                            if (!p2) return;
                            const dx = p1.x - p2.x;
                            const dy = p1.y - p2.y;
                            const dist = Math.hypot(dx, dy) || 1;
                            if (dist < 220) {
                                const force = (220 - dist) / dist * 0.15;
                                p1.vx += (dx / dist) * force;
                                p1.vy += (dy / dist) * force;
                            }
                        });
                    });

                    // Edge spring forces
                    edges.forEach(e => {
                        const p1 = positionsRef.current[e.source];
                        const p2 = positionsRef.current[e.target];
                        if (p1 && p2) {
                            const dx = p2.x - p1.x;
                            const dy = p2.y - p1.y;
                            const dist = Math.hypot(dx, dy) || 1;
                            const force = (dist - 120) * 0.002;
                            p1.vx += (dx / dist) * force;
                            p1.vy += (dy / dist) * force;
                            p2.vx -= (dx / dist) * force;
                            p2.vy -= (dy / dist) * force;
                        }
                    });

                    // Update position with velocity damping
                    nodes.forEach(n => {
                        const p = positionsRef.current[n.id];
                        if (p && dragNode !== n.id) {
                            p.vx *= 0.65;
                            p.vy *= 0.65;
                            p.x += Math.max(-8, Math.min(8, p.vx));
                            p.y += Math.max(-8, Math.min(8, p.vy));
                        }
                    });

                    // Clear Canvas
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.save();
                    ctx.scale(dpr, dpr);
                    ctx.translate(pan.x, pan.y);
                    ctx.scale(zoom, zoom);

                    // Render Edges
                    edges.forEach(e => {
                        const p1 = positionsRef.current[e.source];
                        const p2 = positionsRef.current[e.target];
                        if (p1 && p2) {
                            const isHighlighted = (selectedNode && (e.source === selectedNode.id || e.target === selectedNode.id)) ||
                                                (hoveredNode && (e.source === hoveredNode.id || e.target === hoveredNode.id));

                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = isHighlighted ? '#22d3ee' : 'rgba(148, 163, 184, 0.25)';
                            ctx.lineWidth = isHighlighted ? 2.5 : 1.2;
                            ctx.stroke();

                            // Edge Label
                            const midX = (p1.x + p2.x) / 2;
                            const midY = (p1.y + p2.y) / 2;
                            ctx.fillStyle = isHighlighted ? '#22d3ee' : 'rgba(148, 163, 184, 0.6)';
                            ctx.font = '10px Inter, sans-serif';
                            ctx.textAlign = 'center';
                            ctx.fillText(e.label, midX, midY - 4);
                        }
                    });

                    // Render Nodes
                    nodes.forEach(n => {
                        const p = positionsRef.current[n.id];
                        if (!p) return;

                        const isFiltered = filteredNodeIds.has(n.id);
                        const isSelected = selectedNode && selectedNode.id === n.id;
                        const isHovered = hoveredNode && hoveredNode.id === n.id;
                        const radius = n.val || 18;

                        ctx.save();
                        ctx.globalAlpha = isFiltered ? 1 : 0.25;

                        // Outer Glow Effect for Selected / Hovered
                        if (isSelected || isHovered) {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, radius + 8, 0, 2 * Math.PI);
                            ctx.fillStyle = isSelected ? 'rgba(34, 211, 238, 0.25)' : 'rgba(168, 85, 247, 0.25)';
                            ctx.fill();
                        }

                        // Node Circle Body
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, radius, 0, 2 * Math.PI);
                        ctx.fillStyle = n.color || '#38bdf8';
                        ctx.fill();

                        ctx.lineWidth = isSelected ? 3 : 1.5;
                        ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(255, 255, 255, 0.3)';
                        ctx.stroke();

                        // Label Backing Pill
                        ctx.font = '11px Inter, sans-serif';
                        const textMetrics = ctx.measureText(n.label);
                        const labelWidth = textMetrics.width + 12;
                        const labelHeight = 18;

                        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                        if (ctx.roundRect) {
                            ctx.beginPath();
                            ctx.roundRect(p.x - labelWidth / 2, p.y + radius + 4, labelWidth, labelHeight, 4);
                            ctx.fill();
                        } else {
                            ctx.fillRect(p.x - labelWidth / 2, p.y + radius + 4, labelWidth, labelHeight);
                        }

                        // Text Label
                        ctx.fillStyle = isSelected ? '#22d3ee' : '#f8fafc';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(n.label, p.x, p.y + radius + 13);

                        ctx.restore();
                    });

                    ctx.restore();
                    animationFrameId = requestAnimationFrame(simulatePhysicsAndRender);
                };

                simulatePhysicsAndRender();

                return () => cancelAnimationFrame(animationFrameId);
            }, [nodes, edges, zoom, pan, filteredNodeIds, selectedNode, hoveredNode, dragNode, viewMode]);

            // Mouse Event Handlers
            const handleMouseDown = (e) => {
                if (viewMode !== 'graph') return;
                const rect = canvasRef.current.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - pan.x) / zoom;
                const mouseY = (e.clientY - rect.top - pan.y) / zoom;

                const clickedNode = nodes.find(node => {
                    const p = positionsRef.current[node.id];
                    if (!p) return false;
                    return Math.hypot(p.x - mouseX, p.y - mouseY) <= (node.val || 18);
                });

                if (clickedNode) {
                    setSelectedNode(clickedNode);
                    setDragNode(clickedNode.id);
                } else {
                    setIsDragging(true);
                    setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
                }
            };

            const handleMouseMove = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left - pan.x) / zoom;
                const mouseY = (e.clientY - rect.top - pan.y) / zoom;

                if (dragNode && positionsRef.current[dragNode]) {
                    positionsRef.current[dragNode].x = mouseX;
                    positionsRef.current[dragNode].y = mouseY;
                    positionsRef.current[dragNode].vx = 0;
                    positionsRef.current[dragNode].vy = 0;
                } else if (isDragging) {
                    setPan({
                        x: e.clientX - dragStart.x,
                        y: e.clientY - dragStart.y
                    });
                } else {
                    const hoverTarget = nodes.find(node => {
                        const p = positionsRef.current[node.id];
                        if (!p) return false;
                        return Math.hypot(p.x - mouseX, p.y - mouseY) <= (node.val || 18);
                    });
                    setHoveredNode(hoverTarget || null);
                }
            };

            const handleMouseUp = () => {
                setDragNode(null);
                setIsDragging(false);
            };

            return (
                <div className="h-[calc(100vh-112px)] flex flex-col gap-4">
                    {/* Top Control Bar */}
                    <div className="glass-panel p-3.5 rounded-2xl flex flex-wrap items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-3 flex-1">
                            {/* View Switcher Toggle */}
                            <div className="flex bg-slate-900/90 p-1 rounded-xl border border-slate-700/80">
                                <button
                                    onClick={() => setViewMode('graph')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                                        viewMode === 'graph' 
                                            ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 shadow-sm' 
                                            : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-diagram-project text-xs"></i>
                                    Graph View
                                </button>
                                <button
                                    onClick={() => setViewMode('database')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                                        viewMode === 'database' 
                                            ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40 shadow-sm' 
                                            : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fa-solid fa-database text-xs"></i>
                                    Database View
                                </button>
                            </div>

                            <div className="relative min-w-[200px]">
                                <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input 
                                    type="text"
                                    placeholder={viewMode === 'graph' ? "Search nodes..." : "Filter database records..."}
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pl-9 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors"
                                    aria-label="Filter records"
                                />
                            </div>

                            {viewMode === 'graph' ? (
                                <select 
                                    value={filterType}
                                    onChange={(e) => setFilterType(e.target.value)}
                                    className="bg-slate-900/80 border border-slate-700/80 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
                                    aria-label="Filter by Node Type"
                                >
                                    <option value="all">All Graph Types</option>
                                    <option value="ckg">CKG Core</option>
                                    <option value="entity">Entity Graph</option>
                                    <option value="context">Context Layer</option>
                                    <option value="temporal">Temporal (Time)</option>
                                    <option value="spatial">Spatial (Geo)</option>
                                    <option value="topical">Topical Vector</option>
                                </select>
                            ) : (
                                <div className="flex bg-slate-900/80 p-0.5 rounded-xl border border-slate-800">
                                    <button 
                                        onClick={() => setActiveDbTab('nodes')} 
                                        className={`px-3 py-1 rounded-lg text-xs font-medium ${activeDbTab === 'nodes' ? 'bg-slate-800 text-cyan-300' : 'text-slate-400'}`}
                                    >
                                        Nodes Table ({nodes.length})
                                    </button>
                                    <button 
                                        onClick={() => setActiveDbTab('edges')} 
                                        className={`px-3 py-1 rounded-lg text-xs font-medium ${activeDbTab === 'edges' ? 'bg-slate-800 text-purple-300' : 'text-slate-400'}`}
                                    >
                                        Edges Table ({edges.length})
                                    </button>
                                </div>
                            )}
                        </div>

                        <div className="flex items-center gap-2">
                            {viewMode === 'graph' && (
                                <button
                                    onClick={() => { refreshGraphLayout(true); zoomToBoundingBox(); }}
                                    className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-semibold border border-slate-700 transition-all flex items-center gap-1.5"
                                    title="Recalculate layout & center view"
                                >
                                    <i className="fa-solid fa-rotate text-xs"></i>
                                    Refresh Physics
                                </button>
                            )}

                            <button
                                onClick={onOpenIngest}
                                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-semibold border border-slate-700 transition-all flex items-center gap-1.5"
                            >
                                <i className="fa-solid fa-file-import"></i>
                                Ingest
                            </button>

                            <button
                                onClick={onOpenExport}
                                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-purple-300 text-xs font-semibold border border-slate-700 transition-all flex items-center gap-1.5"
                            >
                                <i className="fa-solid fa-file-export"></i>
                                Export
                            </button>

                            <button
                                onClick={() => setIsNodeModalOpen(true)}
                                className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-semibold text-xs transition-all shadow-md flex items-center gap-2"
                                aria-label="Add Node to Knowledge Graph"
                            >
                                <i className="fa-solid fa-plus"></i>
                                Add Record
                            </button>
                        </div>
                    </div>

                    {/* Canvas & Inspector Split Area OR Database Grid View */}
                    <div className="flex-1 flex gap-4 overflow-hidden relative">
                        {viewMode === 'graph' ? (
                            <div ref={containerRef} id="graph-canvas-container" className="flex-1 glass-panel rounded-2xl overflow-hidden relative border border-slate-800 cursor-grab active:cursor-grabbing w-full">
                                <canvas 
                                    ref={canvasRef}
                                    onMouseDown={handleMouseDown}
                                    onMouseMove={handleMouseMove}
                                    onMouseUp={handleMouseUp}
                                    className="w-full h-full block"
                                    aria-label="Interactive Contextual Knowledge Graph Canvas"
                                />

                                {/* Zoom Controls Bar */}
                                <div className="absolute bottom-4 left-4 glass-panel p-1.5 rounded-xl flex flex-col gap-1 z-10 border border-slate-700 shadow-xl">
                                    <button 
                                        onClick={() => setZoom(z => Math.min(z + 0.25, 3.0))}
                                        className="w-9 h-9 bg-slate-800 hover:bg-slate-700 active:bg-cyan-500 active:text-black rounded-lg text-slate-300 text-xs flex items-center justify-center transition-all"
                                        aria-label="Zoom In"
                                        title="Zoom In (+)"
                                    >
                                        <i className="fa-solid fa-plus"></i>
                                    </button>
                                    <button 
                                        onClick={() => setZoom(z => Math.max(z - 0.25, 0.3))}
                                        className="w-9 h-9 bg-slate-800 hover:bg-slate-700 active:bg-cyan-500 active:text-black rounded-lg text-slate-300 text-xs flex items-center justify-center transition-all"
                                        aria-label="Zoom Out"
                                        title="Zoom Out (-)"
                                    >
                                        <i className="fa-solid fa-minus"></i>
                                    </button>
                                    
                                    <div className="h-[1px] bg-slate-700 my-0.5"></div>

                                    <button 
                                        onClick={zoomDefault}
                                        className="w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-cyan-400 text-xs flex items-center justify-center transition-all"
                                        aria-label="Default Zoom"
                                        title="Default Zoom (1:1 Reset Center)"
                                    >
                                        <i className="fa-solid fa-compress"></i>
                                    </button>

                                    <button 
                                        onClick={zoomToBoundingBox}
                                        className="w-9 h-9 bg-slate-800 hover:bg-slate-700 rounded-lg text-purple-400 text-xs flex items-center justify-center transition-all"
                                        aria-label="Fit All Nodes Zoom"
                                        title="Fit All Nodes in Frame"
                                    >
                                        <i className="fa-solid fa-expand"></i>
                                    </button>

                                    <button 
                                        onClick={zoomToSelectedNode}
                                        disabled={!selectedNode}
                                        className={`w-9 h-9 rounded-lg text-xs flex items-center justify-center transition-all ${
                                            selectedNode 
                                                ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/50 hover:bg-cyan-500/40' 
                                                : 'bg-slate-800/40 text-slate-600 cursor-not-allowed'
                                        }`}
                                        aria-label="Focus Node Zoom"
                                        title={selectedNode ? `Zoom & Focus on "${selectedNode.label}"` : "Select a node first to use Focus Zoom"}
                                    >
                                        <i className="fa-solid fa-crosshairs"></i>
                                    </button>
                                </div>

                                {/* Legend */}
                                <div className="absolute bottom-4 right-4 glass-panel px-3 py-2 rounded-xl text-[11px] text-slate-300 flex flex-wrap gap-3 border border-slate-700">
                                    <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#38bdf8]"></span>CKG</div>
                                    <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#10b981]"></span>Entity</div>
                                    <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#a855f7]"></span>Temporal</div>
                                    <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#f59e0b]"></span>Spatial</div>
                                    <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#ec4899]"></span>Topical</div>
                                </div>
                            </div>
                        ) : (
                            /* DATABASE GRID VIEW COMPONENT */
                            <div className="flex-1 glass-panel rounded-2xl p-4 border border-slate-800 overflow-hidden flex flex-col">
                                {activeDbTab === 'nodes' ? (
                                    <div className="overflow-auto flex-1">
                                        <table className="w-full text-left text-xs text-slate-300 border-collapse">
                                            <thead className="bg-slate-900/90 text-slate-400 font-semibold uppercase tracking-wider sticky top-0 border-b border-slate-800">
                                                <tr>
                                                    <th className="p-3">Node ID</th>
                                                    <th className="p-3">Label / Name</th>
                                                    <th className="p-3">Category Type</th>
                                                    <th className="p-3">Description Context</th>
                                                    <th className="p-3">Degree Links</th>
                                                    <th className="p-3 text-right">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/60 font-sans">
                                                {filteredNodes.map(node => {
                                                    const connectionCount = edges.filter(e => e.source === node.id || e.target === node.id).length;
                                                    const isSelected = selectedNode && selectedNode.id === node.id;
                                                    return (
                                                        <tr 
                                                            key={node.id}
                                                            onClick={() => setSelectedNode(node)}
                                                            className={`hover:bg-slate-800/50 cursor-pointer transition-colors ${
                                                                isSelected ? 'bg-cyan-500/10 border-l-2 border-cyan-400' : ''
                                                            }`}
                                                        >
                                                            <td className="p-3 font-mono text-cyan-400">{node.id}</td>
                                                            <td className="p-3 font-semibold text-white flex items-center gap-2">
                                                                <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: node.color }}></span>
                                                                {node.label}
                                                            </td>
                                                            <td className="p-3">
